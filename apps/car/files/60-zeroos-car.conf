# Car app (README.md): Bluetooth audio settings for WirePlumber.
#
# 1. Bluetooth audio without a login. WirePlumber normally runs Bluetooth
#    audio only while the user's seat is active (someone logged in on the
#    screen). ZeroShell runs as a service, not a login, so without this the
#    Bluetooth audio monitor would never start.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

# 2. A phone's music, not its calls ("Music from your phone"). The
#    Cardputer plays a phone's music (a2dp_sink) and sends its own to cars,
#    speakers and headphones (a2dp_source, bap_*), and still uses a headset's
#    microphone (hfp_ag). It doesn't offer to be a phone's hands-free kit
#    (hfp_hf), so calls stay on the phone.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_ag ]
}
